[package]
name = "agentmux-cli"
license-file = "../../LICENSE"
readme = "../../README.md"
publish = false

version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "agentmux"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agentmux = { path = "../agentmux", features = ["clap"] }
agentmux-mcp = { path = "../agentmux-mcp" }

# The instant `list --since` takes.
chrono.workspace = true
clap.workspace = true
color-eyre.workspace = true
indoc.workspace = true
# Reads `wait --timeout` (`90s`, `2h`), as the library reads `retention`.
humantime.workspace = true
serde.workspace = true
serde_json.workspace = true
# `io-std` is the stdio transport the MCP server runs on.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-std", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
codex-app-server-mock = { path = "../codex-app-server-mock" }
escargot.workspace = true
googletest.workspace = true
# What the tests' fake codex left running, read the way the driver itself reads it.
sysinfo.workspace = true
tempfile.workspace = true

# Only the musl builds swap the allocator; see the workspace manifest.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true
