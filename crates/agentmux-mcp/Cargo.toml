[package]
name = "agentmux-mcp"
license-file = "../../LICENSE"
readme = "../../README.md"
documentation = "https://docs.rs/agentmux-mcp"
publish = false

version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "development-tools"]
keywords = ["agent", "llm", "mcp", "review"]

[lints]
workspace = true

[dependencies]
agentmux = { path = "../agentmux" }

rmcp.workspace = true
schemars.workspace = true
strum.workspace = true

chrono.workspace = true
indoc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `macros` for the `select!` a waiting tool runs its progress notifications beside.
tokio = { workspace = true, features = ["macros", "time"] }
tracing.workspace = true

[dev-dependencies]
googletest.workspace = true
# A client on the other end of an in-memory transport, for the tests that hold the server to
# what a host sees on the wire.
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
# `io-util` for that in-memory transport, `test-util` for a clock a wait of many minutes can run
# against in an instant.
tokio = { workspace = true, features = ["io-util", "macros", "rt", "test-util", "time"] }
