[package]
name = "codex-app-server-codegen"
description = "Generates the codex-app-server-protocol crate from the JSON Schema the codex CLI publishes"
license-file.workspace = true
publish = false

version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "codex-app-server-codegen"
path = "src/main.rs"

[dependencies]
clap.workspace = true
indoc.workspace = true
# Pinned to a commit, and so by the workspace lockfile: the generated sources carry it in their
# header, and moving it is a deliberate regeneration.
progeny = { git = "https://github.com/romnn/progeny", rev = "a0135e084a313beca6939d46b8dd8f78ca0fffc1" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
googletest.workspace = true
