[package]
name = "codex-app-server-oracle"
description = "Checks the generator's method table and the exec stream and rollout mirrors against codex's own Rust at the pinned release"
version = "0.0.0"
edition = "2024"
license-file = "../../../LICENSE"
publish = false

# A workspace of its own: it builds codex's crate, several hundred packages with native
# dependencies, which neither agentmux nor the generator's own tests should pay for.
[workspace]

[dependencies]
codex-app-server-codegen = { path = ".." }
# The pin of the whole protocol: this tag, as `Cargo.lock` resolves it, is the codex release the
# vendored schema must come from (`codex-app-server-codegen pin`).
codex-app-server-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.171.0" }
codex-exec = { git = "https://github.com/openai/codex", tag = "rust-v0.171.0" }
codex-history = { git = "https://github.com/openai/codex", tag = "rust-v0.171.0" }
codex-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.171.0" }
# agentmux's own protocol crate, whose hand-written mirrors of the exec stream and a rollout's usage
# windows are checked here.
mirror = { package = "codex-app-server-protocol", path = "../../codex-app-server-protocol" }
serde_json = "1"

[dev-dependencies]
googletest = "0"

# codex's crates resolve only with codex's own forks, which a dependent must repeat: copy the ones
# this graph uses from `codex-rs/Cargo.toml` at the pinned tag whenever the tag moves.
[patch.crates-io]
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
