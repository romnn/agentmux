# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

dist: goreleaser-dist

homebrew_casks:
  - name: &agentmux agentmux
    ids:
      - *agentmux
    description: "agentmux delegates a question to another vendor's coding agent and captures the whole transcript"
    # The macOS binaries are unsigned, so Homebrew stages them with a quarantine attribute that
    # Gatekeeper then refuses; the postflight step strips it on macOS hosts only.
    # It is a `postflight_steps` block in `custom_block` because goreleaser's `hooks.post.install`
    # renders a `postflight` stanza, which Homebrew 7 warns is deprecated on every `brew` call that
    # touches the tap.
    # goreleaser renders the cask as a Go template first, so `staged_path` is escaped as a raw
    # string.
    custom_block: |
      os macos: "darwin", linux: "linux"

      postflight_steps do
        on_macos do
          if_path_exists "/usr/bin/xattr" do
            run "/usr/bin/xattr",
                args:         ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/agentmux"],
                must_succeed: false
          end
        end
      end
    directory: Casks
    commit_author:
      name: romnn
      email: contact@romnn.com
    repository:
      owner: romnn
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: false

builds:
  - id: *agentmux
    builder: rust
    binary: *agentmux
    targets:
      # linux
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      # apple
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      # windows
      - x86_64-pc-windows-gnu
      - aarch64-pc-windows-gnullvm
    tool: cargo
    command: zigbuild
    flags:
      - "--release"
      - "--package=agentmux-cli"

archives:
  - id: *agentmux
    formats: ["tar.gz"]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - *agentmux
    files:
      - LICENSE
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"

release:
  draft: false
