# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

dist: goreleaser-dist

homebrew_casks:
  - name: &agentmux agentmux
    ids:
      - *agentmux
    description: "agentmux delegates a question to another vendor's coding agent and captures the whole transcript"
    custom_block: |
      os macos: "darwin", linux: "linux"
    directory: Casks
    commit_author:
      name: romnn
      email: contact@romnn.com
    repository:
      owner: romnn
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: false
    hooks:
      post:
        # The macOS binaries are unsigned, so Homebrew stages them with a quarantine
        # attribute that Gatekeeper then refuses. Strip it on macOS hosts only.
        install: |
          if OS.mac? && File.exist?("/usr/bin/xattr")
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agentmux"]
          end

builds:
  - id: *agentmux
    builder: rust
    binary: *agentmux
    targets:
      # linux
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      # apple
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      # windows
      - x86_64-pc-windows-gnu
      - aarch64-pc-windows-gnullvm
    tool: cargo
    command: zigbuild
    flags:
      - "--release"
      - "--package=agentmux-cli"

archives:
  - id: *agentmux
    formats: ["tar.gz"]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - *agentmux
    files:
      - LICENSE
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"

release:
  draft: false
