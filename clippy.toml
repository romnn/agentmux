# unwrap/expect/panic are denied in production code (workspace lints), but
# they are the idiomatic failure mode inside tests — a failing test SHOULD
# panic. These flags scope the denies to non-test code.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Proper nouns that look like code identifiers but should not be backticked in prose.
# `..` appends to clippy's built-in list instead of replacing it.
doc-valid-idents = [".."]

# Tests assert with googletest matchers, not the std macro: `use googletest::prelude::*;`
# then `assert_that!(actual, eq(expected))`. On failure googletest names the matcher that
# did not hold and the value that broke it, instead of dumping two large opaque `Debug`
# strings — which is what comparing whole transcripts otherwise produces. This bans only
# the std macro; googletest's own macros are unaffected.
#
# Note: `std::assert_ne` is left alone. `assert_that!(actual, not(eq(expected)))` is the
# googletest form, but the std macro remains readable for scalars.
disallowed-macros = [
  { path = "std::assert_eq", reason = "use googletest: assert_that!(actual, eq(expected))" },
  { path = "std::dbg", reason = "remove before commit" },
]

pass-by-value-size-limit = 64
stack-size-threshold = 131072
enum-variant-size-threshold = 128
too-large-for-stack = 4096
avoid-breaking-exported-api = false
accept-comment-above-attributes = true
