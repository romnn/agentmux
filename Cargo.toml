[workspace]
resolver = "2"
members = [
	"crates/agentmux",
	"crates/agentmux-mcp",
	"crates/agentmux-cli",
]
default-members = [
	"crates/agentmux-cli",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
authors = ["romnn <contact@romnn.com>"]
description = "agentmux delegates a question to another vendor's coding agent and captures the whole transcript"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/romnn/agentmux"
repository = "https://github.com/romnn/agentmux"

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
unreachable      = "deny"
unimplemented    = "deny"
todo             = "deny"
dbg_macro        = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
# Every `#[allow(...)]` must carry a `reason = "..."` justifying the escape hatch.
allow_attributes_without_reason = "deny"

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = false
targets = [
	"x86_64-unknown-linux-gnu",
	"x86_64-pc-windows-gnu",
	"aarch64-apple-darwin",
]

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
color-eyre = "0"
thiserror = "2"
# Every multi-line string literal in this workspace is an `indoc!`, including the
# prompt scaffolding handed to a delegate CLI, where leading indentation would leak
# into the prompt text.
indoc = "2"

# tracing
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter"] }

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# `schemars` derives the JSON Schema for every MCP tool's input; `rmcp`'s `schemars`
# feature must stay on the same major.
schemars = "1"
# `clock` is what provides `Utc::now`; without it every timestamp would have to be
# injected, and run ids are minted from the wall clock.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# async runtime
# Features are chosen per crate, because the library needs only the timer while the binary
# needs a full runtime and stdio.
tokio = { version = "1", default-features = false }

# Model Context Protocol server SDK: `transport-io` is the stdio transport both
# Claude Code and Codex speak, `macros` provides `#[tool]`/`#[tool_router]`, and
# `schemars` makes tool arguments derive their schema instead of hand-writing it.
rmcp = { version = "3.1.4", features = ["server", "macros", "schemars", "transport-io"] }

# cli
# `env` lets `AGENTMUX_STATE_DIR` select the run store without a flag, which is how an
# MCP host configures it.
clap = { version = "4", features = ["derive", "env"] }

# The Linux release is built against musl so it runs whatever the host's glibc is, and musl's
# own allocator is slow enough under concurrent allocation to be worth replacing. Linked into
# the musl builds only; every other target keeps the system allocator.
mimalloc = "0.1"

# Supplies the random tail of a run identifier, so two consultations started in the same
# second cannot collide.
uuid = { version = "1", features = ["v4"] }
directories = "6"

# Unix process-group and signal handling.
# A delegate CLI spawns its own children, so a cancelled run must signal the whole group
# rather than the direct child.
# The minor version is pinned because `nix` makes breaking changes within 0.x.
# Features are chosen per crate.
nix = "0.31.3"
# Process start time and liveness by pid, on every release target and without `unsafe` of our
# own. A delegate outlives the agentmux that started it, so a pid on disk needs a start time
# beside it before it can be trusted not to have been recycled.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# testing
googletest = "0"
tempfile = "3"
