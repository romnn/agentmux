[files]
ignore-files = true
# Codex's own schema, and what is generated from it, whose descriptions are codex's words, not ours.
extend-exclude = [
  "crates/codex-app-server-codegen/schema/codex_app_server_protocol.schemas.json",
  "crates/codex-app-server-protocol/src/schema.rs",
]

[default]
extend-ignore-re = [
  # "spellcheck:ignore-line" ignores the current line
  "(?Rm)^.*(#|//|--|<!--)\\s*spellcheck:ignore-line(\\s*-->)?\\s*$",

  # "spellcheck:ignore-next-line" ignores the next line
  "(?Rm)^.*(#|//|--|<!--)\\s*spellcheck:ignore-next-line.*?\\n.*?$",

  # "spellcheck:ignore-block" ignores the following block, ending at the first empty line.
  "(?s)(#|//|--|<!--)\\s*spellcheck:ignore-block(.*?)(?:(?:\\r*\\n){2})",

  # Ignore everything between "spellcheck:ignore-start" and "spellcheck:ignore-end".
  "(?s)(#|//|--|<!--)\\s*spellcheck:ignore-start.*?\\n.*?(#|//|--|<!--)\\s*spellcheck:ignore-end",
]
