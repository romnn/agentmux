# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  ZIGBUILD_IMAGE: ghcr.io/rust-cross/cargo-zigbuild:latest
  GORELEASER_VERSION: "2.17.0"

tasks:
  default:
    cmds:
      - task: run

  run:
    desc: "run"
    interactive: true
    cmds:
      # `default-members` is crates/agentmux-cli, so this builds the `agentmux` binary.
      - cargo run -- {{.CLI_ARGS}}

  build:
    desc: "build in debug mode"
    cmds:
      - cargo build --all-targets {{.CLI_ARGS}}

  build:release:
    desc: "build in release mode"
    cmds:
      - cargo build --all-targets --release {{.CLI_ARGS}}

  goreleaser:
    internal: true
    requires:
      vars: [GORELEASER_ARGS]
    cmds:
      # The image ships zig and cargo-zigbuild; only goreleaser is missing.
      # safe.directory: the bind-mounted repo is owned by another uid.
      # The rust it ships is pinned to a version rather than tracking stable, so it drifts below
      # what the dependency tree needs and fails the build naming a crate rather than the image.
      # Installing stable is enough: goreleaser's rust builder runs `rustup target add` for every
      # target it is configured with, so `.goreleaser.yaml` stays the only copy of that list.
      # prettier-ignore
      - >-
        docker run --rm
        -e GITHUB_TOKEN -e TAP_GITHUB_TOKEN
        -e "HOST_UID=$(id -u)" -e "HOST_GID=$(id -g)"
        -v "${PWD}:/workspace" -w /workspace
        {{.ZIGBUILD_IMAGE}}
        bash -euo pipefail -c '
        fix_perms() { for d in target goreleaser-dist; do [ -e "$d" ] && chown -R "${HOST_UID}:${HOST_GID}" "$d" || true; done; };
        trap fix_perms EXIT;
        case "$(uname -m)" in x86_64) arch=x86_64 ;; aarch64|arm64) arch=arm64 ;; *) echo "unsupported arch" >&2; exit 1 ;; esac;
        curl -sSfL "https://github.com/goreleaser/goreleaser/releases/download/v{{.GORELEASER_VERSION}}/goreleaser_Linux_${arch}.tar.gz" | tar -xz -C /usr/local/bin goreleaser;
        rustup toolchain install stable --profile minimal --no-self-update;
        rustup default stable;
        git config --global --add safe.directory "$(pwd)";
        goreleaser {{.GORELEASER_ARGS}}'

  build:goreleaser:
    desc: "build in release mode using goreleaser"
    cmds:
      - task: goreleaser
        vars: { GORELEASER_ARGS: "build --snapshot --clean" }

  release:
    desc: "release using goreleaser"
    cmds:
      - task: goreleaser
        vars: { GORELEASER_ARGS: "release --clean" }

  typos:
    desc: "check repository for typos"
    aliases: [spellcheck]
    cmds:
      - typos

  check:
    desc: "check cargo workspace"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo check --workspace --all-targets {{.CLI_ARGS}}

  check:fc:
    desc: "check cargo workspace for all combinations of features"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - cargo fc check --all-targets {{.CLI_ARGS}}

  clean:
    desc: "clean cargo workspace"
    cmds:
      - cargo clean {{.CLI_ARGS}}

  clean:build:
    desc: "remove zigbuild/cc probe garbage object files"
    cmds:
      # prettier-ignore
      - >-
        find .
        -type f
        \( -name '.intentionally-empty-file.o' -o -name '*_compiler_family.o' \)
        -delete

  docs:cargo:
    desc: "open rustdoc preview"
    env:
      RUSTDOCFLAGS: "--cfg docsrs"
    cmds:
      - cargo +nightly watchdoc --all-features {{.CLI_ARGS}}

  outdated:
    desc: "list outdated deps (incl. new majors): adoptable now vs still in cooldown"
    cmds:
      - cooldown outdated --sync {{.CLI_ARGS}}

  outdated:minor:
    desc: "list outdated deps within the current major only"
    cmds:
      - cooldown outdated --no-major --sync {{.CLI_ARGS}}

  upgrade:
    desc: "upgrade all deps incl. cross-major bumps, within the cooldown"
    aliases: [update]
    cmds:
      - cooldown upgrade --major --sync {{.CLI_ARGS}}

  upgrade:minor:
    desc: "upgrade all deps within their current major, within the cooldown"
    cmds:
      - cooldown upgrade --no-major --sync {{.CLI_ARGS}}

  upgrade:latest:
    desc: "upgrade ignoring the cooldown window — use deliberately"
    prompt:
      - "DANGER: this bypasses the supply-chain cooldown and adopts brand-new (possibly compromised) releases. Prefer 'task upgrade' / 'task upgrade:minor'. Continue?"
    cmds:
      - cooldown upgrade --latest {{.CLI_ARGS}}

  unused:
    desc: "check for unused cargo workspace dependencies"
    aliases: [unused-dependencies]
    cmds:
      - cargo +nightly fc udeps --maximal-features --all-targets {{.CLI_ARGS}}

  audit:
    desc: "audit cargo workspace dependencies"
    cmds:
      - cargo audit {{.CLI_ARGS}}

  format:
    desc: "format cargo workspace"
    cmds:
      - cargo fmt --all {{.CLI_ARGS}}

  test:
    desc: "test cargo workspace"
    cmds:
      - cargo nextest run -P default --workspace --all-targets --no-tests "warn" {{.CLI_ARGS}}

  test:fc:
    desc: "test cargo workspace for all combinations of features"
    cmds:
      - cargo fc nextest run -P default --all-targets --no-tests "warn" {{.CLI_ARGS}}

  test:doc:
    desc: "run doctests in cargo workspace"
    cmds:
      - cargo test --doc --workspace {{.CLI_ARGS}}

  lint:
    desc: "lint cargo workspace"
    cmds:
      - cargo lint --workspace --all-features {{.CLI_ARGS}}

  lint:fc:
    desc: "lint cargo workspace for all combinations of features"
    cmds:
      - cargo fc lint {{.CLI_ARGS}}

  lint:fix:
    desc: "lint and fix cargo workspace"
    aliases: [fix]
    cmds:
      - cargo fixit --workspace --all-features {{.CLI_ARGS}}

  lint:actions:
    desc: "lint github actions"
    cmds:
      - actionlint

  # The protocol generator is a workspace of its own, which nothing else builds; see its manifest.
  codegen:app-server:
    desc: "regenerate codex-app-server-protocol from the vendored codex schema"
    cmds:
      - cargo run --quiet --manifest-path crates/codex-app-server-codegen/Cargo.toml -- generate

  codegen:app-server:check:
    desc: "test the protocol generator, which fails if codex-app-server-protocol is not what the vendored schema generates"
    cmds:
      - cargo test --manifest-path crates/codex-app-server-codegen/Cargo.toml {{.CLI_ARGS}}

  codegen:app-server:lint:
    desc: "lint the protocol generator"
    cmds:
      - cargo clippy --manifest-path crates/codex-app-server-codegen/Cargo.toml --all-targets --no-deps -- -D warnings

  codegen:app-server:refresh:
    desc: "re-export the vendored schema from the pinned codex on PATH, then regenerate"
    cmds:
      # Needs the codex release `codex-app-server-codegen pin` names.
      - cargo run --quiet --manifest-path crates/codex-app-server-codegen/Cargo.toml -- refresh

  codegen:app-server:upstream:
    desc: "fail if the vendored schema is not what the pinned codex on PATH exports"
    cmds:
      - cargo run --quiet --manifest-path crates/codex-app-server-codegen/Cargo.toml -- refresh --check

  codegen:app-server:oracle:
    desc: "fail if the answers table or the exec mirror is not what codex's own crates declare at the pinned tag"
    cmds:
      # Compiling is most of the check, and the test checks how the mirror serialises; it builds
      # codex's crates, so it is slow the first time.
      # Locked, because the lockfile is the pin every other check reads: a tag moved in the
      # manifest alone must fail here rather than check a release nothing else does.
      - cargo test --locked --manifest-path crates/codex-app-server-codegen/oracle/Cargo.toml
